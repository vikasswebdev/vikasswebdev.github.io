<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vikas Patel</title>
    <link href="css/main.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="chat-theme bw-theme">
    <main class="chat-main">
      <section class="chat-hero" id="chat-hero">
        <!-- <p class="chat-hero-label">Welcome</p> -->
        <h1 class="chat-hero-title">Hi, I'm Vikas.</h1>
        <p class="chat-hero-subtitle">
          Full Stack Engineer & AI Enthusiast. Search below to explore my work,
          experience and projects.
        </p>
        <div class="chat-input-wrap">
          <div class="chat-input-inner">
            <i class="fas fa-magnifying-glass chat-input-icon"></i>
            <input
              type="text"
              id="resume-search"
              class="chat-input"
              placeholder="Explore my portfolio"
              autocomplete="off"
            />
            <button
              type="button"
              id="resume-search-btn"
              class="chat-send-btn"
              aria-label="Search"
            >
              <i class="fas fa-arrow-up"></i>
            </button>
          </div>
        </div>
      </section>

      <section
        class="chat-thread"
        id="chat-thread"
        aria-live="polite"
      ></section>
    </main>

    <footer class="chat-footer">
      <div class="chat-footer-links">
        <a
          href="https://github.com/vikasswebdev"
          target="_blank"
          rel="noopener"
          aria-label="GitHub"
          ><i class="fab fa-github"></i
        ></a>
        <a
          href="https://www.linkedin.com/in/vikaswebdev/"
          target="_blank"
          rel="noopener"
          aria-label="LinkedIn"
          ><i class="fab fa-linkedin"></i
        ></a>
        <a
          href="https://x.com/vikaas_ai"
          target="_blank"
          rel="noopener"
          aria-label="X"
          ><i class="fab fa-twitter"></i
        ></a>
        <a
          href="https://www.instagram.com/techbyvikass/"
          target="_blank"
          rel="noopener"
          aria-label="Instagram"
          ><i class="fab fa-instagram"></i
        ></a>
      </div>
    </footer>

    <script src="js/main.js"></script>
  </body>
</html>
